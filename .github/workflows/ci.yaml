# =============================================================================
# CI Pipeline for AI Governance Framework
# =============================================================================
# Runs on every push and PR to main.
# Stages: Lint -> Test -> SAST -> Dependency Audit -> Container Build + Scan
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: Mypy type check
        run: mypy src/ai_governance/

      # The shipped inventory holds example entries with fixed dates, so overdue
      # reviews are reported but do not fail the build. Remove --allow-overdue
      # once the inventory holds your own use cases.
      - name: Check AI use case inventory
        run: ai-gov-inventory --allow-overdue

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        env:
          LLM_API_KEY: "sk-test-ci-pipeline-not-real"
        run: pytest --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          # Newer pip and setuptools first: the versions preinstalled on the
          # runner have open advisories and would fail the audit below.
          pip install --upgrade pip setuptools
          pip install -e ".[dev]"

      - name: Bandit SAST scan
        run: bandit -r src/ai_governance/ -c pyproject.toml -f json -o bandit-report.json

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

      - name: pip-audit dependency check
        run: pip-audit -l --desc

  container:
    name: Container Build & Scan
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t ai-governance:ci .

      - name: Trivy vulnerability scan
        # Pinned to the commit behind v0.36.0. Tags and branches of an action can be moved; a commit cannot.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: "ai-governance:ci"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
