# =============================================================================
# Enterprise AI Acceptable Use Policy (AUP) - v3.0
# =============================================================================
#
# This file controls the behavior of the AI Governance Proxy.
# It is the single source of truth for DLP rules, model restrictions,
# and enforcement behavior.
#
# Changes to this file take effect on server restart. Hot-reload
# is planned for a future release.
#
# sensitivity: LOW | MEDIUM | HIGH | CRITICAL
# action:      ALLOW | REDACT | BLOCK
# =============================================================================

global_settings:
  policy_version: "3.0"
  # enforcement_mode controls how the proxy handles violations:
  #   blocking   - actively block/redact requests (production)
  #   monitoring - log violations but allow all traffic through (rollout/testing)
  enforcement_mode: "blocking"

  # Images, audio and files cannot be scanned for sensitive data. A photo of
  # an ID card would pass straight through. They are refused unless this is true.
  allow_non_text_content: false

  # Glob patterns for approved model families.
  # Empty list = all models allowed.
  # Requests for models not matching any pattern are denied.
  # Review this list regularly. Model names change often.
  # Last reviewed 2026-11-13 against each provider's published model list.
  # Limited-access security research models (OpenAI "cyber", Anthropic "mythos")
  # are left out on purpose. Add them only for an approved use.
  allowed_model_families:
    # OpenAI
    - "gpt-6.1-sol*"
    - "gpt-6.1-terra*"
    - "gpt-6-astra*"
    - "gpt-6-sol*"
    - "gpt-6-luna*"
    - "gpt-5.6-sol*"
    - "gpt-5.6-terra*"
    - "gpt-5.6-luna*"
    - "gpt-5.5"
    - "gpt-5.5-pro*"
    - "gpt-5.4"
    - "gpt-5.4-mini*"
    - "gpt-5.4-pro*"
    - "gpt-4o*"         # OpenAI shuts these down 2027-01-14
    - "gpt-4.1*"        # OpenAI shuts these down 2027-01-14
    # Anthropic
    - "claude-fable*"
    - "claude-opus*"
    - "claude-sonnet*"
    - "claude-haiku*"
    # Google
    - "gemini-4*"
    - "gemini-3*"

# --- DATA LOSS PREVENTION (DLP) RULES ---
# Each key must match a pattern name (lowercase) from the scanning/patterns.py registry.
data_rules:
  # Identity (PII)
  ssn:
    sensitivity: "CRITICAL"
    action: "BLOCK"
  ssn_unformatted:    # 123456789 or 123 45 6789, when labelled "SSN" or "Social Security"
    sensitivity: "CRITICAL"
    action: "BLOCK"
  email:
    sensitivity: "MEDIUM"
    action: "REDACT"
  phone_us:
    sensitivity: "MEDIUM"
    action: "REDACT"
  us_zip_code:
    sensitivity: "LOW"
    action: "ALLOW"   # High false-positive rate. Only redact if context-aware scanning is added.

  # Financial & Assets
  credit_card:
    sensitivity: "HIGH"
    action: "BLOCK"
  vin_number:
    sensitivity: "MEDIUM"
    action: "REDACT"

  # Infrastructure & Secrets (DevOps)
  aws_access_key:
    sensitivity: "CRITICAL"
    action: "BLOCK"
  private_key_block:
    sensitivity: "CRITICAL"
    action: "BLOCK"
  api_key_generic:
    sensitivity: "HIGH"
    action: "BLOCK"
  github_token:
    sensitivity: "CRITICAL"
    action: "BLOCK"
  llm_api_key:        # OpenAI- and Anthropic-style keys (sk-...)
    sensitivity: "CRITICAL"
    action: "BLOCK"
  slack_token:
    sensitivity: "CRITICAL"
    action: "BLOCK"
  google_api_key:
    sensitivity: "CRITICAL"
    action: "BLOCK"
  stripe_key:
    sensitivity: "CRITICAL"
    action: "BLOCK"
  jwt:
    sensitivity: "HIGH"
    action: "BLOCK"
  bearer_token:
    sensitivity: "HIGH"
    action: "BLOCK"
  ip_address:
    sensitivity: "MEDIUM"
    action: "REDACT"

  # Healthcare (HIPAA)
  icd10_code:
    sensitivity: "HIGH"
    action: "REDACT"
  dea_number:
    sensitivity: "HIGH"
    action: "REDACT"
  medical_record_number:   # when labelled "MRN" or "medical record number"
    sensitivity: "HIGH"
    action: "REDACT"
  date_of_birth:           # when labelled "DOB", "date of birth" or "born"
    sensitivity: "HIGH"
    action: "REDACT"

  # Criminal justice (CJIS). These are matched only when labelled.
  fbi_number:              # FBI Number / Universal Control Number
    sensitivity: "CRITICAL"
    action: "BLOCK"
  state_id_number:         # State identification number (SID)
    sensitivity: "CRITICAL"
    action: "BLOCK"
  drivers_license:
    sensitivity: "HIGH"
    action: "REDACT"

# --- RESPONSE RULES ---
# What to do when a pattern appears in the model's reply.
# A pattern not listed here is blocked in replies if it is blocked in prompts
# above, and otherwise allowed. Models often write example e-mail and IP
# addresses, so redact-level data is left alone in replies unless listed here.
output_rules:
  suspicious_url:          # links to .test, .example, .invalid or .localhost
    action: "BLOCK"
  # Example: also redact e-mail addresses in replies
  # email:
  #   action: "REDACT"

# --- GUARDRAILS ---
# Configuration for output-side safety checks.
guardrails:
  hallucination_check:
    # Confidence threshold for response quality.
    # Requires an external confidence scorer to be wired in.
    # Currently a placeholder — no scorer is integrated yet.
    threshold: 0.85
